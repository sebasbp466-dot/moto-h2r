<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Moto Pirueta Briceño</title>
<style>
:root{--y:#ffd400;--r:#e10600;--k:#0a0a0b;--k2:#151517;--w:#f4f4f2;--c:#36e0ff}
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:none}
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0b;font-family:Impact,'Arial Narrow Bold','Arial Black',system-ui,sans-serif;color:var(--w);text-transform:uppercase}
canvas{display:block}
.mono{font-family:'Courier New',monospace;font-weight:700}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#vig{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.78) 100%);opacity:0}
#flash{position:fixed;inset:0;pointer-events:none;opacity:0;background:#fff}
#err{position:fixed;left:0;right:0;bottom:0;background:#a00c;color:#fff;font:12px monospace;padding:6px;display:none;z-index:99;pointer-events:none;text-transform:none}

/* ---------- tablero ---------- */
#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 5px #000a}
#dash{position:absolute;top:8px;left:14px;display:flex;gap:10px;align-items:flex-end}
#spd{font-size:62px;line-height:.9;font-style:italic;letter-spacing:-2px}
#spdu{font-size:13px;letter-spacing:3px;color:var(--y);margin-bottom:6px}
#gear{width:40px;height:46px;border:3px solid var(--y);color:var(--y);font-size:30px;text-align:center;line-height:40px;background:#000a;transform:skewX(-10deg)}
#leds{position:absolute;top:70px;left:14px;display:flex;gap:4px}
#leds i{width:13px;height:9px;background:#ffffff1c;transform:skewX(-20deg);display:block}
#leds i.g{background:#2bff6a;box-shadow:0 0 8px #2bff6a}
#leds i.y{background:var(--y);box-shadow:0 0 8px var(--y)}
#leds i.r{background:#ff2a1a;box-shadow:0 0 10px #ff2a1a}
#mid{position:absolute;top:10px;left:50%;width:30%;transform:translateX(-50%)}
.blab{font-size:10px;letter-spacing:2px;display:flex;justify-content:space-between;opacity:.9}
.bar{height:8px;background:#0009;border:1px solid #fff4;margin:2px 0 6px;transform:skewX(-20deg);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#2bff6a}
.bar.nit i{background:var(--c);box-shadow:0 0 8px var(--c)}
#combo{text-align:center;font-size:22px;color:var(--y);min-height:26px;font-style:italic}
#sc{position:absolute;top:8px;right:14px;text-align:right}
#scl{font-size:10px;letter-spacing:3px;color:var(--y)}
#score{font-size:40px;font-style:italic;line-height:1}
#coins{font-size:16px;color:var(--y)}
#best,#dist{font-size:12px;opacity:.85;letter-spacing:1px}
#msg{position:absolute;top:30%;width:100%;text-align:center;font-size:40px;font-style:italic;opacity:0;letter-spacing:1px;-webkit-text-stroke:1px #0008}
#msg.show{animation:pop .95s ease-out}
@keyframes pop{0%{opacity:0;transform:scale(.4) skewX(-10deg)}15%{opacity:1;transform:scale(1.15) skewX(-10deg)}30%{transform:scale(1) skewX(-10deg)}80%{opacity:1}100%{opacity:0;transform:scale(1.05) skewX(-10deg)}}

#top{position:fixed;top:112px;right:14px;display:flex;gap:8px}
.ib{border:2px solid #fff6;color:#fff;background:#000a;width:44px;height:40px;font-size:18px;transform:skewX(-10deg)}

body.menu #hud,body.menu #ctl,body.menu #top{display:none}
/* ---------- controles ---------- */
#ctl{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
.grp{display:flex;gap:10px;align-items:flex-end}
.cb{pointer-events:auto;font-family:inherit;text-transform:uppercase;color:#fff;background:#0009;border:3px solid #fff8;width:80px;height:76px;font-size:32px;transform:skewX(-10deg);backdrop-filter:blur(2px)}
.cb.wide{width:104px;font-size:15px;letter-spacing:1px;height:72px}
#bG{border-color:var(--y);color:var(--y);height:92px;font-size:20px}
#bW{border-color:var(--w)}
#bN{border-color:var(--c);color:var(--c)}
.cb.on{background:#fffc;color:#000;transform:skewX(-10deg) scale(.94)}

/* ---------- menú ---------- */
#menu,#over{position:fixed;inset:0;display:flex;align-items:stretch;justify-content:space-between}
#menu{background:linear-gradient(100deg,rgba(6,6,7,.96) 0,rgba(6,6,7,.9) 44%,rgba(6,6,7,.1) 66%,rgba(6,6,7,0) 100%)}
#menu:before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,#ffffff06 0 2px,transparent 2px 5px);pointer-events:none}
#menu:after{content:'';position:absolute;left:0;right:0;bottom:0;height:12px;background:repeating-conic-gradient(var(--w) 0 25%,var(--k) 0 50%) 0 0/24px 24px;opacity:.9}
.logo{position:relative;padding:16px 10px 28px 26px;display:flex;flex-direction:column;justify-content:center;max-width:56vw}
.tag{align-self:flex-start;background:var(--y);color:#000;font-size:min(5.2vh,3.6vw);letter-spacing:.32em;padding:2px 14px 2px 10px;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%);font-style:italic}
.t2{font-size:min(17vh,11.5vw);line-height:.92;font-style:italic;letter-spacing:-2px;margin-top:2px}
.t3{font-size:min(23vh,15.5vw);line-height:.86;font-style:italic;letter-spacing:-3px;color:var(--w);-webkit-text-stroke:0;text-shadow:5px 5px 0 var(--r)}
.t3 b{color:var(--y);font-weight:400}
.slash{height:6px;width:min(52vw,420px);background:linear-gradient(90deg,var(--r) 0 60%,transparent 60% 64%,var(--y) 64% 82%,transparent 82% 86%,var(--w) 86%);transform:skewX(-30deg);margin:8px 0 10px}
.spec{display:grid;grid-template-columns:auto auto;gap:2px 18px;align-self:flex-start;font-size:min(3.6vh,2.7vw);letter-spacing:2px}
.spec span{color:var(--y)}
.col{position:relative;width:min(44vw,340px);padding:14px 22px 26px 10px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.mb{pointer-events:auto;font-family:inherit;text-transform:uppercase;color:var(--w);background:transparent;border:2px solid #fff9;padding:9px 12px;font-size:min(5vh,3.8vw);letter-spacing:2px;text-align:left;font-style:italic;clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%)}
.mb.big{background:var(--y);color:#000;border-color:var(--y);font-size:min(9vh,6.4vw);padding:10px 22px;display:flex;justify-content:space-between}
.mb.big:after{content:'►'}
.mb.mid{border-color:var(--y);color:var(--y)}
.rows{margin-top:4px;border-top:2px solid #fff3}
.row{pointer-events:auto;font-family:inherit;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center;width:100%;color:var(--w);background:transparent;border:0;border-bottom:1px solid #fff2;padding:5px 4px;font-size:min(3.9vh,2.9vw);letter-spacing:2px}
.row b{font-family:'Courier New',monospace;color:var(--y);font-weight:700;letter-spacing:0}
.row:active{background:#ffd40022}
#mHelp{font-family:'Courier New',monospace;font-size:min(2.7vh,2vw);opacity:.7;text-transform:none;margin-top:2px}

#over{display:none;background:rgba(6,6,7,.86);flex-direction:column;align-items:center;justify-content:center;gap:4px}
#ovt{font-size:min(20vh,13vw);font-style:italic;color:var(--r);text-shadow:4px 4px 0 #000;line-height:1}
#ovs{font-size:min(8vh,6vw);color:var(--w);font-style:italic}
#ovc{font-size:min(6vh,4.6vw);color:var(--y);margin-bottom:8px}
.ovb{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(84vw,560px)}

/* ---------- garaje ---------- */
#garage{position:fixed;top:0;right:0;bottom:0;width:min(60vw,570px);display:none;flex-direction:column;gap:6px;padding:8px 12px 10px 54px;background:linear-gradient(90deg,transparent 0,rgba(8,8,9,.96) 11%);clip-path:polygon(40px 0,100% 0,100% 100%,0 100%)}
#gTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
#gMoney{font-size:min(6vh,4.4vw);color:var(--y);font-style:italic}
#gTabs{display:flex;gap:4px;flex-wrap:wrap}
.gtab{pointer-events:auto;font-family:inherit;text-transform:uppercase;border:0;border-bottom:3px solid #fff3;background:transparent;color:#fff9;font-size:min(3.8vh,2.8vw);letter-spacing:2px;padding:5px 9px}
.gtab.sel{color:#000;background:var(--y);border-color:var(--y);clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
#gBody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px}
#gBody,#gBody *{touch-action:pan-y}
.gcard,.gup{pointer-events:auto;font-family:inherit;text-transform:uppercase;text-align:left;border:0;border-left:6px solid #fff3;background:#ffffff12;color:#fff;padding:7px 10px;display:flex;flex-direction:column;gap:2px}
.gcard.sel{border-left-color:var(--y);background:#ffd40018}
.gname{font-size:min(4.4vh,3.3vw);font-style:italic;letter-spacing:1px}
.gdesc{font-family:'Courier New',monospace;font-weight:700;font-size:min(2.8vh,2.1vw);opacity:.85}
.gstat{font-family:'Courier New',monospace;font-size:min(2.6vh,2vw);color:var(--y)}
.grow{display:flex;flex-direction:column;gap:4px}
.glab{font-size:min(3.2vh,2.4vw);color:var(--y);letter-spacing:3px}
.gsw{display:flex;gap:6px;flex-wrap:wrap}
.sw{pointer-events:auto;width:min(8vh,6vw);height:min(6.4vh,5vw);border:2px solid #fff4;color:#fff;font-size:15px;padding:0;transform:skewX(-12deg)}
.sw.sel{border-color:#fff;box-shadow:0 0 0 2px #000,0 0 0 4px var(--y)}
.gcyc{align-self:flex-start;min-width:50%}
</style>
</head>
<body class="menu">
<canvas id="fx"></canvas>
<div id="vig"></div>
<div id="flash"></div>
<div id="hud">
  <div id="dash"><div id="spd">0</div><div id="spdu">KM/H</div><div id="gear">N</div></div>
  <div id="leds"></div>
  <div id="mid">
    <div class="blab"><span>EQUILIBRIO</span></div><div class="bar"><i id="bal"></i></div>
    <div class="blab"><span>NITRO</span></div><div class="bar nit"><i id="nit"></i></div>
    <div id="combo"></div>
  </div>
  <div id="sc"><div id="scl">PUNTOS</div><div id="score" class="mono">0</div><div id="coins"></div><div id="best" class="mono"></div><div id="dist" class="mono"></div></div>
  <div id="msg"></div>
</div>
<div id="top"><button id="bC" class="ib">📷</button><button id="bP" class="ib">II</button></div>
<div id="ctl">
  <div class="grp"><button id="bL" class="cb">◀</button><button id="bR" class="cb">▶</button></div>
  <div class="grp"><button id="bN" class="cb wide">NITRO</button><button id="bW" class="cb wide">CABALLITO</button><button id="bG" class="cb wide">GAS</button></div>
</div>

<div id="menu">
  <div class="logo">
    <div class="tag">MOTO PIRUETA</div>
    <div class="t3">BRICE<b>Ñ</b>O</div>
    <div class="slash"></div>
    <div class="spec mono">
      <div>MÁQUINA</div><div><span id="mBike">NINJA H2R</span></div>
      <div>MAPA</div><div><span id="mMapName">ATARDECER</span></div>
      <div>BANCO</div><div><span id="mBank">0</span></div>
      <div>RÉCORD</div><div><span id="mRec">0</span></div>
    </div>
  </div>
  <div class="col">
    <button id="mPlay" class="mb big">JUGAR</button>
    <button id="mGarage" class="mb mid">GARAJE · MEJORAS · ESTILO</button>
    <button id="mNew" class="mb" style="display:none">NUEVA PARTIDA</button>
    <div class="rows">
      <button id="mMap" class="row">MAPA<b>-</b></button>
      <button id="mCam" class="row">CÁMARA<b>-</b></button>
      <button id="mQ" class="row">CALIDAD<b>-</b></button>
      <button id="mS" class="row">SONIDO<b>-</b></button>
      <button id="mM" class="row">MÚSICA<b>-</b></button>
      <button id="mTest" class="row">PROBAR AUDIO<b>-</b></button>
    </div>
    <div id="mHelp">arrastra la pantalla para mover la cámara</div>
  </div>
</div>

<div id="garage">
  <div id="gTop"><div id="gMoney">0</div><button id="gDone" class="mb mid" style="padding:6px 16px">LISTO</button></div>
  <div id="gTabs"></div>
  <div id="gBody"></div>
</div>

<div id="over">
  <div id="ovt">¡CHOCASTE!</div>
  <div id="ovs" class="mono">0 pts</div>
  <div id="ovc"></div>
  <div class="ovb">
    <button id="mRetry" class="mb big">REINTENTAR</button>
    <button id="mHome" class="mb mid">MENÚ</button>
  </div>
</div>
<div id="err"></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
